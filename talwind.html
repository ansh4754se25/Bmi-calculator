<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-lime-100">

    <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-lg shadow-md">

        <h1 class="text-3xl font-bold text-center mb-2">
            BMI Calculator
        </h1>

        <p class="text-center text-gray-600 mb-8">
            Calculate your Body Mass Index
        </p>


        <!-- Weight -->
        <div class="mb-5">

            <label for="weight" class="block text-lg font-semibold mb-2">
                Weight
            </label>

            <input
                type="number"
                id="weight"
                placeholder="Enter weight in kg"
                class="w-full border border-gray-300 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

        </div>


        <!-- Height -->
        <div class="mb-5">

            <label for="height" class="block text-lg font-semibold mb-2">
                Height
            </label>

            <input
                type="number"
                id="height"
                placeholder="Enter height in cm"
                class="w-full border border-gray-300 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

        </div>


        <!-- Button -->
        <button
            onclick="calculateBMI()"
            class="w-full bg-blue-500 text-white py-3 rounded-md font-semibold hover:bg-blue-600"
        >
            Calculate BMI
        </button>


        <!-- Result -->
        <div
            id="result"
            class="text-center text-xl font-bold mt-6"
        >
        </div>

    </div>
 <script src="bmi.js"></script>
</body>

</html>
